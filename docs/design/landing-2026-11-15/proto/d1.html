<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D1 First lines</title>
<link rel="stylesheet" href="shared.css">
<style>
  .wrap { padding: 0 96px; height: calc(900px - 72px); display: flex; flex-direction: column; }
  h1 { font-size: 16px; font-weight: 500; color: var(--muted); margin-top: 40px; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 24px; }
  .line { font-family: Newsreader, Georgia, serif; line-height: 1.04; max-width: 1080px; text-wrap: balance; }
  .line[data-s="xl"] { font-size: 156px; } .line[data-s="l"] { font-size: 104px; } .line[data-s="m"] { font-size: 76px; } .line[data-s="s"] { font-size: 60px; }
  .line span { display: inline-block; animation: w .6s var(--ease-out) both; }
  @keyframes w { from { opacity: 0; transform: translateY(.14em); filter: blur(6px); } }
  .by { display: flex; align-items: center; gap: 20px; margin-top: 28px; font-size: 14px; color: var(--muted); }
  .by .btn { height: 40px; }
  .search { margin-top: 24px; max-width: 560px; }
  .shelf { display: flex; align-items: flex-end; gap: 3px; margin-top: 28px; border-bottom: 1px solid var(--border); height: 300px; }
  .spine { cursor: pointer; } .spine.on { transform: translateY(-20px) rotate(-1.2deg); }
</style></head>
<body>
<div class="hdr"><b>Bibliotech<i>.</i></b><nav><a href="#" style="margin-right:8px">About</a><a class="btn out">Log in</a><a class="btn pri">Register</a></nav></div>
<div class="wrap">
  <h1>Free public&#8209;domain books</h1>
  <div class="stage">
    <div class="line" id="line"></div>
    <div class="by"><span id="by"></span><a class="btn pri" id="read">Read it</a></div>
    <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search 242 books by title or author"><span class="kbd">Ctrl K</span></div>
  </div>
  <div class="shelf" id="shelf"></div>
</div>
<script src="shared.js"></script>
<script>
  const line = document.getElementById("line"), by = document.getElementById("by"), read = document.getElementById("read"), shelf = document.getElementById("shelf");
  function size(n) { return n <= 20 ? "xl" : n <= 60 ? "l" : n <= 120 ? "m" : "s"; }
  function show(i) {
    const b = BOOKS[i];
    line.dataset.s = size(b.line.length);
    line.innerHTML = b.line.split(" ").map((w, k) => `<span style="animation-delay:${k * 22}ms">${w}</span>`).join(" ");
    by.textContent = `${b.author}, ${b.title}`;
    read.textContent = `Read ${b.title}`;
    [...shelf.children].forEach((el, k) => el.classList.toggle("on", k === i));
  }
  BOOKS.forEach((b, i) => {
    const s = document.createElement("button");
    s.className = "spine"; s.style.cssText = `width:${b.w}px;height:${b.h}px;background:${b.background};color:${b.color}`;
    s.innerHTML = `<span class="t">${b.title}</span>`;
    s.onclick = () => show(i);
    shelf.appendChild(s);
  });
  show(0);
</script>
</body></html>
